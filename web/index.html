<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parquet</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.nba.com">
  <link rel="preload" href="fonts/archivo.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-display.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem("parquet-theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      if (localStorage.getItem("parquet-spoiler-free") === "1") document.documentElement.dataset.spoiler = "1";
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Parquet, retour aux matchs">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M3 16h26M16 3v26M7.2 6.6c3.6 2.6 5.6 5.9 5.6 9.4s-2 6.8-5.6 9.4M24.8 6.6c-3.6 2.6-5.6 5.9-5.6 9.4s2 6.8 5.6 9.4" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Parquet</span>
      </a>

      <nav class="mainnav" aria-label="Navigation principale">
        <a href="#/" data-nav="matchs">Matchs</a>
        <a href="#/classement" data-nav="classement">Classement</a>
        <a href="#/equipes" data-nav="equipes">Équipes</a>
        <a href="#/joueurs" data-nav="joueurs">Joueurs</a>
        <a href="#/leaders" data-nav="leaders">Leaders</a>
      </nav>

      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="global-search" type="search" placeholder="Un joueur, une équipe…" autocomplete="off" spellcheck="false"
               aria-label="Rechercher un joueur ou une équipe" aria-controls="search-results" aria-expanded="false" role="combobox">
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="spoiler-toggle" type="button" aria-label="Activer le mode anti-spoiler" title="Mode anti-spoiler">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Passer au thème clair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="state center"><div class="spinner" aria-hidden="true"></div><p>Chargement…</p></div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>Données NBA.com pour un usage personnel. Biographies issues de Wikipédia (licence CC BY-SA). Parquet n'est pas affilié à la NBA.</span>
      <a href="#/etat">État des sources</a>
    </div>
  </footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
