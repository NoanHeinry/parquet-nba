name: Tests

on:
  push:
  pull_request:

# Pipeline de Parquet. Un serveur lancé avec « --auto-maj » (téléphone, Raspberry Pi) n'installe
# une nouvelle version que si TOUS ces contrôles sont passés pour son commit.
jobs:
  verifications:
    name: Vérifications rapides (JavaScript, scripts, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/verifier-code.sh

  unitaires:
    name: Tests unitaires (Python ${{ matrix.python-version }})
    # Ubuntu 24.04 : la plus récente à fournir encore Python 3.9, la version minimale de Parquet.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # cryptography : seulement pour les tests, qui vérifient les notifications push indépendamment
      # du code de Parquet (lequel s'en passe : Python pur, comme sur un téléphone Android).
      - run: python -m pip install -r requirements.txt cryptography
      - run: python -m unittest discover -s tests -t . -v
      - name: Notifications push en Python pur (comme sur un téléphone)
        run: python -m unittest tests.test_push -v
        env:
          PARQUET_PUSH_PUR: "1"

  interface:
    name: Tests d'interface (Chromium, mode démo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt playwright cryptography
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_ui -v
